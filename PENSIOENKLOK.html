<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to 2029</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #1e1f72 0%, #2e2a98 50%, #413db3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(36, 35, 117, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
            animation: shimmer 8s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: #ef0909;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            position: relative;
        }

        .title.small {
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
        }

        .title:hover {
            color: #ff3333;
            text-shadow: 0 0 20px rgba(239, 9, 9, 0.5);
            transform: scale(1.05);
        }

        .fire-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }

        .fire-particle {
            position: absolute;
            width: 40px;
            height: 80px;
            background: linear-gradient(to top, #ff4500, #ff6500, #ff8500);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: fireRise 0.8s ease-out forwards;
        }

        @keyframes fireRise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateY(-80px) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-160px) scale(0.5);
                opacity: 0;
            }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 4vw, 3rem);
            flex-wrap: wrap;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(232, 244, 248, 0.3);
            border-radius: 20px;
            padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 3vw, 2rem);
            min-width: clamp(120px, 15vw, 200px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .time-unit.celebration {
            animation: celebrate 2s ease-in-out;
        }

        @keyframes celebrate {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-20px) rotate(-5deg) scale(1.1); }
            50% { transform: translateY(-30px) rotate(5deg) scale(1.2); }
            75% { transform: translateY(-20px) rotate(-3deg) scale(1.1); }
        }

        .time-unit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .time-unit:hover::before {
            left: 100%;
        }

        .time-unit:hover {
            transform: translateY(-10px);
            border-color: rgba(232, 244, 248, 0.6);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(232, 244, 248, 0.2);
        }

        .number {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: #e8f4f8;
            display: block;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .label {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #b8d4e3;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .subtitle {
            margin-top: 3rem;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #ef0909;
            font-weight: 400;
            opacity: 0.8;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .subtitle:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #2e2a98 0%, #413db3 100%);
            margin: 15% auto;
            padding: 2rem;
            border: 2px solid rgba(232, 244, 248, 0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            color: #e8f4f8;
            font-family: 'Orbitron', monospace;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .date-input, .text-input {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(232, 244, 248, 0.3);
            border-radius: 10px;
            color: #e8f4f8;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .date-input:focus, .text-input:focus {
            outline: none;
            border-color: #ef0909;
            box-shadow: 0 0 10px rgba(239, 9, 9, 0.3);
        }

        .text-input::placeholder {
            color: rgba(232, 244, 248, 0.6);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-primary {
            background: #ef0909;
            color: white;
        }

        .btn-primary:hover {
            background: #ff3333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 9, 9, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e8f4f8;
            border: 2px solid rgba(232, 244, 248, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .countdown {
                gap: 1rem;
            }

            .time-unit {
                min-width: 100px;
                padding: 1.5rem 1rem;
            }

            .modal-content {
                margin: 25% auto;
                padding: 1.5rem;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(232, 244, 248, 0.6);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .floating-element:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            left: 30%;
            animation-delay: 4s;
        }

        .floating-element:nth-child(4) {
            left: 40%;
            animation-delay: 6s;
        }

        .floating-element:nth-child(5) {
            left: 50%;
            animation-delay: 8s;
        }

        .floating-element:nth-child(6) {
            left: 60%;
            animation-delay: 10s;
        }

        .floating-element:nth-child(7) {
            left: 70%;
            animation-delay: 12s;
        }

        .floating-element:nth-child(8) {
            left: 80%;
            animation-delay: 14s;
        }

        .floating-element:nth-child(9) {
            left: 90%;
            animation-delay: 16s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        /* Fireworks */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        .firework-spark {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes fireworkExplode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <h1 class="title" id="titleClick">PENSIOEN DATUM COUNTDOWN</h1>
        <div class="fire-overlay" id="fireOverlay"></div>
        <div class="countdown">
            <div class="time-unit">
                <span class="number" id="years">0</span>
                <span class="label">Years</span>
            </div>
            <div class="time-unit">
                <span class="number" id="months">0</span>
                <span class="label">Months</span>
            </div>
            <div class="time-unit">
                <span class="number" id="days">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">0</span>
                <span class="label">Hours</span>
            </div>
        </div>
        <p class="subtitle" id="subtitleText">Until January 29, 2029</p>
    </div>

    <!-- Date Modal -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <h2>Set Custom Date</h2>
            <h2>maand/dag/jaar</h2>
            <input type="datetime-local" id="customDate" class="date-input" />
            <div class="modal-buttons">
                <button class="btn btn-primary" id="setDate">Set Date</button>
                <button class="btn btn-secondary" id="cancelDate">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Text Edit Modal -->
    <div id="textModal" class="modal">
        <div class="modal-content">
            <h2>Edit Title Text</h2>
            <input type="text" id="customText" class="text-input" placeholder="Enter your custom title..." maxlength="50" />
            <div class="modal-buttons">
                <button class="btn btn-primary" id="setText">Set Title</button>
                <button class="btn btn-secondary" id="cancelText">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let targetDate = new Date('Jan 29 2029 00:00:00 GMT+0200');
        let countdownInterval;
        let isTimeUp = false;
        let originalTitle = 'PENSIOEN DATUM COUNTDOWN';

        // Modal elements
        const dateModal = document.getElementById('dateModal');
        const textModal = document.getElementById('textModal');
        const titleElement = document.getElementById('titleClick');
        const customDateInput = document.getElementById('customDate');
        const customTextInput = document.getElementById('customText');
        const setDateBtn = document.getElementById('setDate');
        const cancelDateBtn = document.getElementById('cancelDate');
        const setTextBtn = document.getElementById('setText');
        const cancelTextBtn = document.getElementById('cancelText');
        const subtitleText = document.getElementById('subtitleText');
        const fireOverlay = document.getElementById('fireOverlay');

        // Global function for debugging
        window.forceOutOfTimeSequence = function() {
            isTimeUp = true;
            startEndSequence();
        };

        // Event listeners
        titleElement.addEventListener('click', openEditTextModal);
        subtitleText.addEventListener("click", openModal);
        setDateBtn.addEventListener('click', setCustomDate);
        cancelDateBtn.addEventListener('click', closeDateModal);
        setTextBtn.addEventListener('click', setCustomText);
        cancelTextBtn.addEventListener('click', closeTextModal);
        
        // Close modals when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === dateModal) {
                closeDateModal();
            }
            if (event.target === textModal) {
                closeTextModal();
            }
        });

        // Close modals with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (dateModal.style.display === 'block') {
                    closeDateModal();
                }
                if (textModal.style.display === 'block') {
                    closeTextModal();
                }
            }
        });

        // Enter key support for text input
        customTextInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                setCustomText();
            }
        });

        function openModal() {
            if (isTimeUp) return;
            // Set current target date as default value
            const currentDateTime = new Date(targetDate.getTime() - (targetDate.getTimezoneOffset() * 60000));
            customDateInput.value = currentDateTime.toISOString().slice(0, 16);
            dateModal.style.display = 'block';
            customDateInput.focus();
        }

        function openEditTextModal() {
            if (isTimeUp) return;
            // Set current title as default value
            customTextInput.value = titleElement.textContent;
            textModal.style.display = 'block';
            customTextInput.focus();
            customTextInput.select(); // Select all text for easy editing
        }

        function closeDateModal() {
            dateModal.style.display = 'none';
        }

        function closeTextModal() {
            textModal.style.display = 'none';
        }

        function setCustomDate() {
            const selectedDate = new Date(customDateInput.value);
            
            if (isNaN(selectedDate.getTime())) {
                alert('Please enter a valid date and time.');
                return;
            }

            if (selectedDate <= new Date()) {
                alert('Please select a future date and time.');
                return;
            }

            targetDate = selectedDate;
            isTimeUp = false;
            updateSubtitle();
            updateCountdown();
            closeDateModal();
        }

        function setCustomText() {
            const newText = customTextInput.value.trim();
            
            if (newText === '') {
                alert('Please enter a title text.');
                return;
            }

            if (newText.length > 50) {
                alert('Title text must be 50 characters or less.');
                return;
            }

            originalTitle = newText.toUpperCase();
            titleElement.textContent = originalTitle;
            closeTextModal();
        }

        function updateSubtitle() {
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            subtitleText.textContent = `Until ${targetDate.toLocaleDateString('en-US', options)}`;
        }

        function updateCountdown() {
            if (isTimeUp) return;
            
            const now = new Date();
            const difference = targetDate - now;
            const {days, hours, months, years} = getPreciseTimeDifference(now, targetDate);
            
            if (difference > 0) {
                animateNumber('years', years);
                animateNumber('months', months);
                animateNumber('days', days);
                animateNumber('hours', hours);
            } else {
                // Target date has passed
                if (!isTimeUp) {
                    isTimeUp = true;
                    startEndSequence();
                }
            }
        }

        function animateNumber(elementId, newValue) {
            const element = document.getElementById(elementId);
            const currentValue = parseInt(element.textContent) || 0;

            if (currentValue !== newValue) {
                element.style.transform = 'scale(1.1)';
                element.style.transition = 'transform 0.3s ease';

                setTimeout(() => {
                    element.textContent = newValue;
                    element.style.transform = 'scale(1)';
                }, 150);
            }
        }

        function startEndSequence() {
            // Set all counters to 0
            document.getElementById('years').textContent = '0';
            document.getElementById('months').textContent = '0';
            document.getElementById('days').textContent = '0';
            document.getElementById('hours').textContent = '0';

            // Add celebration animation to time units
            const timeUnits = document.querySelectorAll('.time-unit');
            timeUnits.forEach(unit => {
                unit.classList.add('celebration');
            });

            // Create fireworks
            createFireworks();

            // Start typewriter effect after 2 seconds
            setTimeout(() => {
                startTypewriterSequence();
            }, 2000);
        }

        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500'];
            
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * window.innerWidth + 'px';
                    firework.style.top = Math.random() * window.innerHeight + 'px';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(firework);

                    // Create sparks
                    for (let j = 0; j < 12; j++) {
                        const spark = document.createElement('div');
                        spark.className = 'firework-spark';
                        spark.style.left = firework.style.left;
                        spark.style.top = firework.style.top;
                        spark.style.backgroundColor = firework.style.backgroundColor;
                        
                        const angle = (j * 30) * Math.PI / 180;
                        const distance = 50 + Math.random() * 50;
                        const endX = Math.cos(angle) * distance;
                        const endY = Math.sin(angle) * distance;
                        
                        spark.style.animation = `fireworkExplode 1s ease-out forwards`;
                        spark.style.transform = `translate(${endX}px, ${endY}px)`;
                        
                        document.body.appendChild(spark);
                        
                        setTimeout(() => {
                            spark.remove();
                        }, 1000);
                    }

                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }, i * 200);
            }
        }

        function startTypewriterSequence() {
            titleElement.textContent = '';
            titleElement.classList.add('small');
            titleElement.style.cursor = 'default';
            
            const message = "THIS PROGRAM WILL SELF DESTRUCT IN 5 SECONDS";
            
            typewriterEffect(titleElement, message, 50, () => {
                startCountdownSequence();
            });
        }

        function startCountdownSequence() {
            let count = 5;
            
            const countdownInterval = setInterval(() => {
                // Find the number in the title and replace it
                const currentText = titleElement.textContent;
                const newText = currentText.replace(/\d+/, count.toString());
                
                // Clear and retype just the number
                const numberIndex = newText.indexOf(count.toString());
                titleElement.textContent = newText.substring(0, numberIndex);
                
                titleElement.innerText = newText;
                
                if (count === 0) {
                    clearInterval(countdownInterval);
                    setTimeout(() => {
                        startFireEffect();
                    }, 500);
                }
                count--;
            }, 1000);
        }

        function typewriterEffect(element, text, speed, callback) {
            const currentText = element.textContent;
            let i = 0;
            
            const typeInterval = setInterval(() => {
                element.textContent = currentText + text.substring(0, i + 1);
                i++;
                
                if (i >= text.length) {
                    clearInterval(typeInterval);
                    if (callback) callback();
                }
            }, speed);
        }

        function startFireEffect() {
            fireOverlay.style.opacity = '1';
            
            const titleRect = titleElement.getBoundingClientRect();
            const containerRect = titleElement.parentElement.getBoundingClientRect();
            
            // Create fire particles
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'fire-particle';
                    
                    const x = Math.random() * titleRect.width;
                    const y = titleRect.height;
                    
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    
                    fireOverlay.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.remove();
                    }, 800);
                }, i * 20);
            }
            
            // Fade out the title as fire consumes it
            setTimeout(() => {
                titleElement.style.transition = 'opacity 2s ease-out';
                titleElement.style.opacity = '0';
                
                setTimeout(() => {
                    titleElement.textContent = '';
                    fireOverlay.style.opacity = '0';
                }, 2000);
            }, 1000);
        }

        function getPreciseTimeDifference(date1, date2) {
            // Ensure date1 is always the earlier date for simpler logic
            const startDate = new Date(Math.min(date1.getTime(), date2.getTime()));
            const endDate = new Date(Math.max(date1.getTime(), date2.getTime()));

            let years = 0;
            let months = 0;
            let days = 0;
            let hours = 0;
            let minutes = 0;

            // 1. Calculate Minutes and Hours exactly from the raw millisecond difference
            const diffMillis = endDate.getTime() - startDate.getTime();
            minutes = Math.floor(diffMillis / (1000 * 60));
            hours = Math.floor(minutes / 60);

            minutes = minutes % 60; // Remaining minutes
            hours = hours % 24;     // Remaining hours after full days

            // 2. Calculate Years, Months, and Days by iterating and adjusting
            let current = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate(), startDate.getHours(), startDate.getMinutes());
            let tempEndDate = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate(), endDate.getHours(), endDate.getMinutes());

            // Adjust current date to only consider up to the hour for calendar calculation
            current.setHours(0, 0, 0, 0);
            tempEndDate.setHours(0, 0, 0, 0);

            // Calculate years
            while (current.getFullYear() < tempEndDate.getFullYear() ||
                (current.getFullYear() === tempEndDate.getFullYear() && (current.getMonth() < tempEndDate.getMonth() ||
                    (current.getMonth() === tempEndDate.getMonth() && current.getDate() <= tempEndDate.getDate())))) {

                let nextYear = new Date(current.getFullYear() + 1, current.getMonth(), current.getDate());

                if (nextYear.getMonth() !== current.getMonth() || nextYear.getDate() !== current.getDate()) {
                    nextYear = new Date(current.getFullYear() + 1, current.getMonth() + 1, 0);
                }

                if (nextYear.getTime() <= tempEndDate.getTime()) {
                    years++;
                    current.setFullYear(current.getFullYear() + 1);
                } else {
                    break;
                }
            }

            // Calculate months
            while (current.getFullYear() < tempEndDate.getFullYear() ||
                (current.getFullYear() === tempEndDate.getFullYear() && (current.getMonth() < tempEndDate.getMonth() ||
                    (current.getMonth() === tempEndDate.getMonth() && current.getDate() <= tempEndDate.getDate())))) {

                let nextMonth = new Date(current.getFullYear(), current.getMonth() + 1, current.getDate());

                if (nextMonth.getMonth() !== (current.getMonth() + 1) % 12 || nextMonth.getFullYear() !== current.getFullYear() + Math.floor((current.getMonth() + 1) / 12)) {
                    nextMonth = new Date(current.getFullYear(), current.getMonth() + 1, 0);
                }

                if (nextMonth.getTime() <= tempEndDate.getTime()) {
                    months++;
                    current.setMonth(current.getMonth() + 1);
                } else {
                    break;
                }
            }

            // Calculate days
            while (current.getTime() <= tempEndDate.getTime() - (1000 * 60 * 60 * 24)) {
                days++;
                current.setDate(current.getDate() + 1);
            }

            return {
                years: years,
                months: months,
                days: days,
                hours: hours !== 0 ? hours : minutes !== 0 ? 1 : hours,
            };
        }

        // Initialize countdown
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 10000);
    </script>
